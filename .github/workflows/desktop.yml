# 自动打包桌面应用：在 GitHub 的 Actions 页面手动运行，或推送 v 开头的标签（如 v0.2.0）时运行。
# 产物：KnowFlow-macOS.zip（Apple 芯片 Mac）和 KnowFlow-Windows.zip，在运行记录页面底部的 Artifacts 下载；
# 推送标签时还会自动发布到 Releases。
name: 打包桌面应用

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: KnowFlow-macOS
          - os: windows-latest
            artifact: KnowFlow-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 编译前端
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: pip install -r backend/requirements.txt -r backend/requirements-desktop.txt -r packaging/requirements-build.txt

      - name: 打包
        run: python packaging/build_desktop.py

      - name: 压缩（macOS）
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/KnowFlow.app ${{ matrix.artifact }}.zip

      - name: 压缩（Windows）
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/KnowFlow -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
